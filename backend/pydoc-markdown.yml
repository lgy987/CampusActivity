loaders:
  - type: python
    modules:
      - models
      - app.services.auth_service
      - app.services.user_service
      - app.services.activity_service
      - app.services.registration_service
      - app.services.checkin_service
      - app.services.notification_service
      - app.services.category_service
      - app.services.stats_service
      - app.common.auth
      - app.common.errors
      - app.common.response
      - app.api.auth
      - app.api.user
      - app.api.activities
      - app.api.admin_activities
      - app.api.admin_users
      - app.api.categories
      - app.api.checkin
      - app.api.notifications
      - app.api.registrations
      - app.api.statistics
    search_path: [.]

processors:
  - type: filter
    expression: "not name.startswith('_') and name not in ['Base', 'relationship', 'Column', 'declarative_base', 'func', 'UniqueConstraint', 'ForeignKey', 'Text', 'db_session', 'get_db', 'SessionLocal', 'engine', 're', 'datetime', 'timedelta', 'Counter', 'random', 'string', 'jsonify', 'Blueprint', 'request', 'g', 'current_app', 'url_for', 'Path', 'uuid4', 'generate_password_hash', 'check_password_hash', 'secure_filename', 'or_', 'jwt']"
  - type: smart

renderer:
  type: markdown
  filename: ../docs/API.md
  render_toc: true
  header_level_by_type:
    module: 1
    class: 2
    method: 3
  add_method_class_prefix: true