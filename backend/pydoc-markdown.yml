loaders:
  - type: python
    modules:
      - models
      - app.services.auth_service
      - app.services.user_service
      - app.services.activity_service
      - app.services.registration_service
      - app.services.checkin_service
      - app.services.notification_service
      - app.services.stats_service
      - app.services.category_service
      - app.common.auth
      - app.common.errors
      - app.common.response
      - app.api.auth
      - app.api.user
      - app.api.activities
      - app.api.registrations
      - app.api.checkin
      - app.api.notifications
      - app.api.announcements
    search_path: [.]

processors:
  - type: filter
    expression: |
      not name.startswith('_') and 
      name not in [
        'Base', 'relationship', 'Column', 'declarative_base', 
        'func', 'UniqueConstraint', 'ForeignKey', 'Text',
        'db_session', 'get_db', 'SessionLocal', 'engine'
      ]
  - type: smart
  - type: crossref

renderer:
  type: markdown
  filename: ../docs/API.md
  render_toc: true
  header_level_by_type:
    module: 1
    class: 2
    method: 3
    function: 3
    variable: 4