name: Generate API Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  generate:
    name: 生成后端 API 文档
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('backend/requirements.txt') }}

      - name: 安装依赖
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pydoc-markdown

      - name: 生成 API 文档
        working-directory: backend
        run: pydoc-markdown

      - name: 创建 README 索引
        run: |
          cat > docs/README.md << 'EOF'
          # 校园活动平台文档

          ## API 文档
          - [完整 API 文档](./API.md)

          ## 生成时间
          EOF
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> docs/README.md

      - name: 上传文档产物
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/
          retention-days: 30